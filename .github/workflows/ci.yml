name: CI

# Régimen CI/CD nuevo (decisión del dueño, 2026-08-01): NO se abren PRs y la
# validación en GitHub Actions NO se dispara automáticamente con push/PR (la
# única excepción del repo es sync-main-to-dev, que no valida nada: solo alinea
# dev con main tras publicar). La validación real
# es LOCAL — `make ci-local` (fmt+vet+lint+test+build) y `make ci-docker`
# (mismo toolchain que este workflow, en contenedor) antes de mergear y
# pushear. Este workflow queda como corrida MANUAL (workflow_dispatch): sirve
# para verificación puntual y de base para los releases futuros.
# Homólogo a wapp-cloudlink/edge (Go 1.26.5, golangci-lint v2.12.2 — Plan 027).
# SIN deploy a GCP ni GitHub Packages. Módulo PÚBLICO: sin GOPRIVATE ni token.
on:
  workflow_dispatch:

env:
  GO_VERSION: '1.26.5'

jobs:
  test:
    name: Tests + estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt (sin archivos sin formatear)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Descargar dependencias
        run: go mod download

      - name: go.mod / go.sum tidy (sin diff)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Tests (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  integration:
    name: Integración (procesos, testcontainers)
    runs-on: ubuntu-latest
    # Los procesos de negocio (test/procesos, etiqueta `integracion`) son la ÚNICA prueba del
    # repo contra Postgres. No hay service container: el propio `go test` levanta UN Postgres con
    # testcontainers (el runner trae Docker) y clona una base por proceso; ningún test apunta a
    # una base que ya esté corriendo. Sin Docker el job FALLA, no se salta, y `make
    # test-procesos` sale ≠ 0 también si algún proceso da `--- SKIP`.
    env:
      # El TestMain de test/procesos exige GOWORK=off en el entorno (el Makefile ya lo antepone a
      # cada `go`; aquí va también para el `go mod download`).
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Descargar dependencias
        run: go mod download
      - name: Procesos de negocio (Postgres de testcontainers)
        run: make test-procesos
      # El target deja la salida entera de `go test -v` en /tmp/procesos.log (PROCESOS_LOG_DIR
      # por defecto) y solo imprime el resumen: sin este paso, un rojo no diría qué proceso falló.
      - name: Log de los procesos (cola)
        if: always()
        run: tail -n 300 /tmp/procesos.log || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        # v2.12.2 está COMPILADO con go1.26 (v2.4.0 iba con go1.25 y no podía cargar
        # un go.mod que apunta a go 1.26.0 → exit 3 "can't load config"). Plan 027.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
